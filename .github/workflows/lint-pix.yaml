name: Lint - pix

on:
  pull_request:
    paths:
      - apps/pix/**
      - .golangci.yml
      - .github/workflows/lint-pix.yaml
      - .github/workflows/reusable-lint-go.yaml
  push:
    branches:
      - main
    paths:
      - apps/pix/**
      - .golangci.yml
      - .github/workflows/lint-pix.yaml
      - .github/workflows/reusable-lint-go.yaml

jobs:
  go:
    uses: ./.github/workflows/reusable-lint-go.yaml
    with:
      working-directory: apps/pix
    permissions:
      contents: read
